version: 2

project_name: workerid

builds:
  - # If true, skip the build.
    # Useful for library projects.
    # Default is false
    skip: true

changelog:
  # Keep the changelog pipe enabled so `--release-notes` is honored.
  # `disable: true` would ignore that flag and publish an empty GitHub Release body.
  #
  # Do not generate notes from git/GitHub commits (the old `use: github` +
  # regex groups produced v0.2.0-style notes). The Goreleaser workflow extracts
  # the matching `## WorkerID vX.Y.Z` section from CHANGELOG.md and passes it
  # with `--release-notes`.
  disable: false
